name: Build Nexus APK

# Produces an installable Android APK as a downloadable artifact, so a phone
# can be set up without a local Android toolchain.
on:
  push:
    branches: [main]
    paths: ["nexus/**", ".github/workflows/build-nexus-apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nexus/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run android:sync

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: nexus/android

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-apk
          path: nexus/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
